<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC 知识库 · 项目复盘 · 面试速查</title>
<style>
:root {
  --bg: #0f1117;
  --bg-card: #1a1d28;
  --bg-card-hover: #22263a;
  --bg-input: #1a1d28;
  --text: #c8ccd4;
  --text-dim: #7a7f8e;
  --text-bright: #e8ecf2;
  --accent: #4ade80;
  --accent2: #60a5fa;
  --accent3: #f59e0b;
  --border: #2a2d3a;
  --border-hover: #3a3d4a;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  min-height: 100vh;
}

/* Header */
.header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  position: sticky;
  top: 0;
  z-index: 100;
  backdrop-filter: blur(12px);
}
.header-inner {
  max-width: 1100px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.logo {
  font-size: 1.2rem;
  font-weight: 700;
  color: var(--text-bright);
  display: flex;
  align-items: center;
  gap: 8px;
}
.logo .chip { font-size: 1.4rem; }
.logo span { color: var(--accent); }

/* Search */
.search-wrap {
  position: relative;
  flex: 1;
  max-width: 320px;
  min-width: 200px;
}
.search-wrap input {
  width: 100%;
  padding: 8px 14px 8px 36px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text);
  font-size: 0.9rem;
  outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-dim);
  font-size: 0.9rem;
  pointer-events: none;
}

/* Tabs */
.tabs {
  display: flex;
  gap: 4px;
  background: var(--bg);
  border-radius: var(--radius);
  padding: 4px;
  margin: 0 auto;
  max-width: 1100px;
  width: calc(100% - 48px);
}
.tab-btn {
  flex: 1;
  padding: 10px 20px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.95rem;
  cursor: pointer;
  border-radius: 8px;
  transition: all 0.2s;
  white-space: nowrap;
}
.tab-btn:hover { color: var(--text); }
.tab-btn.active {
  background: var(--bg-card);
  color: var(--accent);
  font-weight: 600;
}

/* Main */
.main {
  max-width: 1100px;
  margin: 24px auto;
  padding: 0 24px;
}

/* Category Filter */
.filter-bar {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.filter-chip {
  padding: 5px 14px;
  border-radius: 16px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-dim);
  font-size: 0.85rem;
  cursor: pointer;
  transition: all 0.2s;
}
.filter-chip:hover { border-color: var(--border-hover); color: var(--text); }
.filter-chip.active {
  background: var(--accent);
  color: var(--bg);
  border-color: var(--accent);
  font-weight: 600;
}

/* Knowledge Cards */
.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  gap: 16px;
}
.knowledge-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  cursor: pointer;
  transition: all 0.2s;
}
.knowledge-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow); }
.knowledge-card.expanded { border-color: var(--accent); }
.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 10px;
}
.card-tag {
  display: inline-block;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
}
.tag-riscv { background: rgba(74,222,128,0.15); color: var(--accent); }
.tag-arm { background: rgba(96,165,250,0.15); color: var(--accent2); }
.tag-debug { background: rgba(245,158,11,0.15); color: var(--accent3); }
.tag-integration { background: rgba(168,85,247,0.15); color: #a855f7; }
.tag-bus { background: rgba(236,72,153,0.15); color: #ec4899; }
.tag-other { background: rgba(148,163,184,0.15); color: #94a3b8; }
.card-title {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-bright);
  margin: 10px 0 4px;
}
.card-subtitle {
  font-size: 0.85rem;
  color: var(--text-dim);
  margin-bottom: 8px;
}
.card-detail {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 0.9rem;
  line-height: 1.7;
}
.knowledge-card.expanded .card-detail { display: block; }
.card-detail h4 {
  color: var(--accent);
  font-size: 0.85rem;
  margin: 12px 0 4px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.card-detail h4:first-child { margin-top: 0; }
.card-detail ul {
  margin: 4px 0 0 18px;
  color: var(--text);
}
.card-detail li { margin-bottom: 2px; }
.card-detail code {
  font-family: var(--font-mono);
  background: rgba(255,255,255,0.06);
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 0.85em;
  color: var(--accent2);
}

/* Projects Timeline */
.timeline {
  position: relative;
  padding-left: 32px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 11px;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--border);
}
.timeline-item {
  position: relative;
  margin-bottom: 28px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  cursor: pointer;
  transition: all 0.2s;
}
.timeline-item:hover { border-color: var(--border-hover); }
.timeline-item.expanded { border-color: var(--accent2); }
.timeline-dot {
  position: absolute;
  left: -25px;
  top: 24px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent2);
  border: 2px solid var(--bg);
}
.timeline-year {
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--accent2);
  text-transform: uppercase;
}
.timeline-title {
  font-size: 1.05rem;
  font-weight: 600;
  color: var(--text-bright);
  margin: 4px 0;
}
.timeline-role {
  font-size: 0.85rem;
  color: var(--text-dim);
}
.timeline-detail {
  display: none;
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px solid var(--border);
  font-size: 0.9rem;
}
.timeline-item.expanded .timeline-detail { display: block; }
.timeline-detail h4 {
  color: var(--accent2);
  font-size: 0.8rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin: 10px 0 4px;
}
.timeline-detail h4:first-child { margin-top: 0; }

/* Flash Cards */
.flash-filter {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}
.flash-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 16px;
}
.flash-card {
  perspective: 800px;
  height: 200px;
  cursor: pointer;
}
.flash-inner {
  position: relative;
  width: 100%;
  height: 100%;
  transition: transform 0.5s;
  transform-style: preserve-3d;
}
.flash-card.flipped .flash-inner { transform: rotateY(180deg); }
.flash-front, .flash-back {
  position: absolute;
  width: 100%;
  height: 100%;
  backface-visibility: hidden;
  border-radius: var(--radius);
  padding: 20px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border: 1px solid var(--border);
}
.flash-front {
  background: var(--bg-card);
  text-align: center;
}
.flash-front .flash-q {
  font-size: 1rem;
  font-weight: 600;
  color: var(--text-bright);
}
.flash-front .flash-hint {
  font-size: 0.75rem;
  color: var(--text-dim);
  margin-top: 8px;
}
.flash-back {
  background: var(--bg-card);
  transform: rotateY(180deg);
  overflow-y: auto;
  font-size: 0.9rem;
  line-height: 1.7;
}
.flash-back h4 { color: var(--accent); font-size: 0.8rem; margin: 8px 0 4px; }
.flash-back h4:first-child { margin-top: 0; }
.flash-tag {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 0.7rem;
  font-weight: 700;
  margin-bottom: 8px;
}

/* Empty State */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-dim);
}
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; }
.empty-state p { font-size: 0.95rem; }

/* Footer */
.footer {
  text-align: center;
  padding: 24px;
  color: var(--text-dim);
  font-size: 0.8rem;
  border-top: 1px solid var(--border);
  margin-top: 40px;
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* Responsive */
@media (max-width: 768px) {
  .header-inner { flex-direction: column; align-items: flex-start; }
  .search-wrap { max-width: 100%; }
  .cards-grid { grid-template-columns: 1fr; }
  .flash-grid { grid-template-columns: 1fr; }
  .tabs { width: calc(100% - 24px); }
  .tab-btn { font-size: 0.85rem; padding: 8px 12px; }
}

/* Fade in */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.cards-grid > *, .timeline-item, .flash-card {
  animation: fadeIn 0.3s ease-out;
}

/* Summary bar */
.summary-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  color: var(--text-dim);
  font-size: 0.85rem;
}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="chip">🔲</span> IC Notebook
      <span>· 知识库</span>
    </div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索知识点、项目、面试题…" oninput="doSearch()">
    </div>
  </div>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('knowledge')">📚 知识库</button>
  <button class="tab-btn" onclick="switchTab('projects')">📋 项目复盘</button>
  <button class="tab-btn" onclick="switchTab('flashcards')">⚡ 速查卡</button>
</div>

<div class="main" id="mainContent"></div>

<div class="footer">
  IC Notebook · 个人知识管理 & 面试备战工具 · 点击卡片展开详情
</div>

    detail: `<h4>核心概念</h4>
<p>PLIC（Platform-Level Interrupt Controller）负责管理外部中断源，将中断路由到多个 Hart，支持优先级仲裁。</p>
<h4>玄铁 PLIC 特点</h4>
<ul>
  <li>支持 <code>N_SOURCES</code> 个中断源，<code>N_CONTEXTS</code> 个上下文</li>
  <li>优先级寄存器：<code>priority[source_id]</code>，值越大优先级越高（0 表示禁用）</li>
  <li>Threshold 寄存器：<code>threshold[context_id]</code>，低于此优先级的中断被屏蔽</li>

</ul>

<ul>

</ul>`
  },

    subtitle: 'Machine Timer / MSIP 机制',
    detail: `<h4>核心概念</h4>
<p>CLINT（Core-Local Interruptor）提供每个 Hart 的本地中断：软件中断（MSIP）和定时器中断（MTIP）。</p>
<h4>寄存器</h4>
<ul>
  <li><code>msip[hart_id]</code>：软件中断挂起位，写 1 触发，写 0 清除</li>

</ul>
<h4>面试要点</h4>
<ul>
  <li>CLINT vs PLIC 区别：CLINT 是 core-local，PLIC 是 platform-level</li>
  <li>软件中断的典型用途：核间通信（IPI）</li>
  <li>定时器中断的典型用途：OS 调度 tick</li>
</ul>`
  },
  {

    subtitle: 'Distributor / Redistributor / CPU Interface',

<ul>
  <li><strong>Distributor</strong>：全局中断管理，优先级配置，中断分组</li>
  <li><strong>Redistributor</strong>：per-PE 中断管理，LPIs（Locality-specific Peripheral Interrupts）</li>
  <li><strong>CPU Interface</strong>：每个 PE 的中断接口，优先级掩码，EOI</li>
</ul>
<h4>中断类型</h4>
<ul>
  <li><strong>SGI</strong>（Software Generated Interrupt）：核间中断，ID 0-15</li>
  <li><strong>PPI</strong>（Private Peripheral Interrupt）：per-PE 外设中断，ID 16-31</li>
  <li><strong>SPI</strong>（Shared Peripheral Interrupt）：共享外设中断，ID 32-1019</li>
  <li><strong>LPI</strong>（Locality-specific Peripheral Interrupt）：基于 ITS 的消息中断，ID 8192+</li>

  <li>支持 GICv4.1，含虚拟化扩展</li>
  <li>支持 ITS（Interrupt Translation Service）用于 MSI/MSI-X</li>
  <li>支持 <code>nVHE</code>（non-VHE）/ <code>VHE</code>（Virtualization Host Extensions）</li>

</ul>`

<h4>系统集成要点</h4>
<ul>
  <li>DM 需要访问系统总线（System Bus Access）</li>
  <li>Halt/Run 控制：<code>haltreq</code> / <code>resumereq</code></li>

<h4>玄铁 Debug 特点</h4>
<ul>
  <li>支持 Trigger Module（硬件断点）</li>
  <li>支持 Program Buffer（批量执行指令）</li>
</ul>`

let currentTab = 'knowledge';
let activeCat = 'all';

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => {
    if (b.textContent.includes(tab === 'knowledge' ? '知识库' : tab === 'projects' ? '项目复盘' : '速查卡')) {
      b.classList.add('active');
    }
  });
  activeCat = 'all';
  render();
}

function render() {
  const main = document.getElementById('mainContent');
  const query = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

  if (currentTab === 'knowledge') renderKnowledge(main, query);
  else if (currentTab === 'projects') renderProjects(main, query);
  else renderFlashcards(main, query);
}

function renderKnowledge(main, query) {
  let items = knowledgeData;
  if (query) {
    items = items.filter(i =>
      i.title.toLowerCase().includes(query) ||
      i.subtitle.toLowerCase().includes(query) ||
      i.detail.toLowerCase().includes(query) ||
      i.tag.toLowerCase().includes(query)
    );
  }
  if (activeCat !== 'all') {
    items = items.filter(i => i.cat === activeCat);
  }

  const categories = [
    { key: 'all', label: '全部' },
    { key: 'riscv', label: 'RISC-V 中断' },
    { key: 'arm', label: 'ARM 中断' },
    { key: 'debug', label: 'Debug' },
    { key: 'integration', label: '系统集成' },
    { key: 'bus', label: '总线' },
    { key: 'other', label: '通用' },
  ];

  let html = `<div class="filter-bar">`;
  categories.forEach(c => {
    html += `<button class="filter-chip${activeCat === c.key ? ' active' : ''}" onclick="setCat('${c.key}')">${c.label}</button>`;
  });
  html += `</div>`;
  html += `<div class="summary-bar">共 ${items.length} 条知识点</div>`;

  if (items.length === 0) {
    html += `<div class="empty-state"><div class="icon">📭</div><p>没有找到匹配的知识点</p></div>`;
  } else {
    html += `<div class="cards-grid">`;
    items.forEach(item => {
      html += `
        <div class="knowledge-card" id="kc-${item.id}" onclick="toggleCard('kc-${item.id}')">
          <div class="card-header">
            <span class="card-tag ${item.tagClass}">${item.tag}</span>
          </div>
          <div class="card-title">${item.title}</div>
          <div class="card-subtitle">${item.subtitle}</div>
          <div class="card-detail">${item.detail}</div>
        </div>`;
    });
    html += `</div>`;
  }

  main.innerHTML = html;
}

function renderProjects(main, query) {
  let items = projectData;
  if (query) {
    items = items.filter(i =>
      i.title.toLowerCase().includes(query) ||
      i.role.toLowerCase().includes(query) ||
      i.detail.toLowerCase().includes(query) ||
      i.year.includes(query)
    );
  }

  let html = `<div class="summary-bar">共 ${items.length} 个项目（参与 6 款芯片设计）</div>`;

  if (items.length === 0) {
    html += `<div class="empty-state"><div class="icon">📋</div><p>没有找到匹配的项目</p></div>`;
  } else {
    html += `<div class="timeline">`;
    items.forEach(p => {
      html += `
        <div class="timeline-item" id="pj-${p.id}" onclick="toggleCard('pj-${p.id}')">
          <div class="timeline-dot"></div>
          <div class="timeline-year">${p.year}</div>
          <div class="timeline-title">${p.title}</div>
          <div class="timeline-role">${p.role}</div>
          <div class="timeline-detail">${p.detail}</div>
        </div>`;
    });
    html += `</div>`;
  }
  main.innerHTML = html;
}

function renderFlashcards(main, query) {
  let items = flashcardData;
  if (query) {
    items = items.filter(i =>
      i.q.toLowerCase().includes(query) ||
      i.a.toLowerCase().includes(query)
    );
  }
  if (activeCat !== 'all') {
    items = items.filter(i => i.cat === activeCat);
  }

  const categories = [
    { key: 'all', label: '全部' },
    { key: 'riscv', label: 'RISC-V' },
    { key: 'arm', label: 'ARM' },
    { key: 'debug', label: 'Debug' },
    { key: 'bus', label: '总线' },
    { key: 'integration', label: '系统集成' },
    { key: 'other', label: '通用' },
  ];

  let html = `<div class="flash-filter">`;
  categories.forEach(c => {
    html += `<button class="filter-chip${activeCat === c.key ? ' active' : ''}" onclick="setCat('${c.key}')">${c.label}</button>`;
  });
  html += `</div>`;
  html += `<div class="summary-bar">共 ${items.length} 张速查卡 · 点击翻转查看答案</div>`;

  if (items.length === 0) {
    html += `<div class="empty-state"><div class="icon">⚡</div><p>没有找到匹配的速查卡</p></div>`;
  } else {
    html += `<div class="flash-grid">`;
    items.forEach(f => {
      const tagMap = { riscv: 'tag-riscv', arm: 'tag-arm', debug: 'tag-debug', integration: 'tag-integration', bus: 'tag-bus', other: 'tag-other' };
      const labelMap = { riscv: 'RISC-V', arm: 'ARM', debug: 'Debug', integration: '系统集成', bus: '总线', other: '通用' };
      html += `
        <div class="flash-card" id="fc-${f.id}" onclick="flipCard('fc-${f.id}')">
          <div class="flash-inner">
            <div class="flash-front">
              <span class="flash-tag card-tag ${tagMap[f.cat] || 'tag-other'}">${labelMap[f.cat] || f.cat}</span>
              <div class="flash-q">${f.q}</div>
              <div class="flash-hint">👆 点击翻转查看答案</div>
            </div>
            <div class="flash-back">${f.a}</div>
          </div>
        </div>`;
    });
    html += `</div>`;
  }
  main.innerHTML = html;
}

function setCat(cat) {
  activeCat = cat;
  render();
}

function toggleCard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('expanded');
}

function flipCard(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.classList.toggle('flipped');
}

function doSearch() {
  activeCat = 'all';
  render();
}

// Init
render();
</script>
</body>
</html>
