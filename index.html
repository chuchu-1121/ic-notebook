<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IC Notebook · 知识库</title>
<style>
/* ===== CSS Variables ===== */
:root {
  --bg: #0f1117;
  --bg-card: #1a1d28;
  --bg-card-hover: #22263a;
  --bg-input: #1a1d28;
  --text: #c8ccd4;
  --text-dim: #7a7f8e;
  --text-bright: #e8ecf2;
  --accent: #4ade80;
  --accent2: #60a5fa;
  --accent3: #f59e0b;
  --danger: #ef4444;
  --border: #2a2d3a;
  --border-hover: #3a3d4a;
  --shadow: 0 2px 12px rgba(0,0,0,0.3);
  --radius: 10px;
  --radius-sm: 6px;
  --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
}
[data-theme="light"] {
  --bg: #f5f6f8;
  --bg-card: #ffffff;
  --bg-card-hover: #f0f1f5;
  --bg-input: #ffffff;
  --text: #4a4d5a;
  --text-dim: #9a9dae;
  --text-bright: #1a1d28;
  --accent: #16a34a;
  --accent2: #2563eb;
  --accent3: #d97706;
  --danger: #dc2626;
  --border: #e2e4e9;
  --border-hover: #c8cad4;
  --shadow: 0 2px 12px rgba(0,0,0,0.08);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { scrollbar-gutter: stable; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ===== Header ===== */
.header {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(12px);
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px;
}
.logo {
  font-size: 1.1rem; font-weight: 700;
  color: var(--text-bright);
  display: flex; align-items: center; gap: 6px;
  text-decoration: none; cursor: pointer;
}
.logo span { color: var(--accent); }
.header-actions { display: flex; gap: 8px; align-items: center; }
.theme-btn {
  background: none; border: 1px solid var(--border);
  border-radius: 50%; width: 34px; height: 34px;
  font-size: 1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-bright); transition: all 0.2s;
}
.theme-btn:hover { border-color: var(--border-hover); background: var(--bg-card-hover); }
.btn {
  padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text);
  font-size: 0.85rem; cursor: pointer; transition: all 0.2s;
  white-space: nowrap;
}
.btn:hover { border-color: var(--border-hover); }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
.btn-primary:hover { opacity: 0.85; }
.btn-sm { padding: 4px 12px; font-size: 0.78rem; }
.user-badge { color: var(--accent); font-weight: 600; font-size: 0.85rem; }

/* ===== Main ===== */
.main { max-width: 1100px; margin: 24px auto; padding: 0 24px; }
.view { display: none; }
.view.active { display: block; animation: fadeIn 0.3s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Homepage ===== */
.hero {
  text-align: center; padding: 60px 20px 40px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); margin-bottom: 24px;
}
.hero .icon { font-size: 3rem; margin-bottom: 12px; }
.hero h1 { font-size: 1.8rem; color: var(--text-bright); margin-bottom: 8px; }
.hero h1 span { color: var(--accent); }
.hero p { color: var(--text-dim); font-size: 1rem; max-width: 600px; margin: 0 auto 20px; }
.feature-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 16px; margin-bottom: 24px;
}
.feature-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; text-align: center;
}
.feature-card .f-icon { font-size: 2rem; margin-bottom: 8px; }
.feature-card h3 { color: var(--text-bright); font-size: 1rem; margin-bottom: 4px; }
.feature-card p { color: var(--text-dim); font-size: 0.85rem; }

/* ===== Auth ===== */
.auth-wrap {
  max-width: 400px; margin: 60px auto;
}
.auth-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 36px; text-align: center;
  box-shadow: var(--shadow);
}
.auth-card .a-icon { font-size: 2.5rem; margin-bottom: 10px; }
.auth-card h2 { color: var(--text-bright); font-size: 1.2rem; margin-bottom: 4px; }
.auth-card .sub { color: var(--text-dim); font-size: 0.85rem; margin-bottom: 20px; }
.auth-card .field { text-align: left; margin-bottom: 14px; }
.auth-card label { display: block; color: var(--text-dim); font-size: 0.8rem; margin-bottom: 4px; }
.auth-card input {
  width: 100%; padding: 10px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-input);
  color: var(--text); font-size: 0.95rem; outline: none;
  transition: border-color 0.2s;
}
.auth-card input:focus { border-color: var(--accent); }
.auth-card .btn { width: 100%; padding: 10px; font-size: 0.95rem; margin-top: 6px; }
.auth-card .error { color: var(--danger); font-size: 0.82rem; margin-top: 8px; display: none; }
.auth-card .error.show { display: block; }
.auth-switch { margin-top: 14px; font-size: 0.85rem; color: var(--text-dim); }
.auth-switch a { color: var(--accent); cursor: pointer; text-decoration: none; }
.auth-switch a:hover { text-decoration: underline; }

/* ===== Dashboard Tabs ===== */
.tabs { display: flex; gap: 4px; background: var(--bg); border-radius: var(--radius); padding: 4px; margin-bottom: 20px; }
.tab-btn { flex: 1; padding: 10px 16px; border: none; background: transparent; color: var(--text-dim); font-size: 0.9rem; cursor: pointer; border-radius: 8px; transition: all 0.2s; white-space: nowrap; }
.tab-btn:hover { color: var(--text); }
.tab-btn.active { background: var(--bg-card); color: var(--accent); font-weight: 600; }

/* ===== Search ===== */
.search-wrap { position: relative; margin-bottom: 16px; }
.search-wrap input {
  width: 100%; padding: 10px 14px 10px 38px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--bg-input);
  color: var(--text); font-size: 0.9rem; outline: none;
  transition: border-color 0.2s;
}
.search-wrap input:focus { border-color: var(--accent); }
.search-wrap .s-icon { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-dim); }

/* ===== Filter ===== */
.filter-bar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-chip {
  padding: 4px 12px; border-radius: 14px; border: 1px solid var(--border);
  background: transparent; color: var(--text-dim); font-size: 0.8rem;
  cursor: pointer; transition: all 0.2s;
}
.filter-chip:hover { border-color: var(--border-hover); color: var(--text); }
.filter-chip.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }

/* ===== Cards ===== */
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; align-items: start; }
.knowledge-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; cursor: pointer;
  transition: all 0.2s; position: relative;
}
.knowledge-card:hover { border-color: var(--border-hover); box-shadow: var(--shadow); }
.knowledge-card.expanded { border-color: var(--accent); }
.card-tag {
  display: inline-block; padding: 2px 10px; border-radius: 12px;
  font-size: 0.7rem; font-weight: 600; white-space: nowrap;
}
.tag-riscv { background: rgba(74,222,128,0.15); color: var(--accent); }
.tag-arm { background: rgba(96,165,250,0.15); color: var(--accent2); }
.tag-debug { background: rgba(245,158,11,0.15); color: var(--accent3); }
.tag-integration { background: rgba(168,85,247,0.15); color: #a855f7; }
.tag-bus { background: rgba(236,72,153,0.15); color: #ec4899; }
.tag-verilog { background: rgba(20,184,166,0.15); color: #14b8a6; }
.tag-other { background: rgba(148,163,184,0.15); color: #94a3b8; }
.card-title { font-size: 0.95rem; font-weight: 600; color: var(--text-bright); margin: 8px 0 2px; }
.card-subtitle { font-size: 0.8rem; color: var(--text-dim); margin-bottom: 6px; }
.card-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.85rem; line-height: 1.7; }
.knowledge-card.expanded .card-detail { display: block; }
.card-detail h4 { color: var(--accent); font-size: 0.78rem; margin: 10px 0 4px; text-transform: uppercase; letter-spacing: 0.05em; }
.card-detail h4:first-child { margin-top: 0; }
.card-detail ul { margin: 4px 0 0 18px; }
.card-detail li { margin-bottom: 2px; }
.card-detail code { font-family: var(--font-mono); background: rgba(255,255,255,0.06); padding: 1px 5px; border-radius: 3px; font-size: 0.85em; color: var(--accent2); }
.card-actions {
  display: flex; gap: 6px; margin-top: 10px; padding-top: 10px;
  border-top: 1px solid var(--border);
}
.card-actions .btn { font-size: 0.75rem; padding: 3px 10px; }

/* ===== Add/Edit Form ===== */
.add-card {
  background: var(--bg-card); border: 2px dashed var(--border);
  border-radius: var(--radius); padding: 16px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--text-dim); font-size: 0.9rem; min-height: 80px;
  transition: all 0.2s;
}
.add-card:hover { border-color: var(--accent); color: var(--accent); }
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center;
  z-index: 1000; backdrop-filter: blur(2px);
}
.modal-overlay.hidden { display: none; }
.modal {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 24px; width: min(520px, 92vw);
  max-height: 85vh; overflow-y: auto; box-shadow: var(--shadow);
}
.modal h3 { color: var(--text-bright); margin-bottom: 14px; font-size: 1.05rem; }
.modal .field { margin-bottom: 12px; }
.modal label { display: block; color: var(--text-dim); font-size: 0.8rem; margin-bottom: 4px; }
.modal input, .modal select, .modal textarea {
  width: 100%; padding: 8px 12px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-input);
  color: var(--text); font-size: 0.9rem; outline: none;
  font-family: var(--font);
}
.modal textarea { min-height: 120px; resize: vertical; }
.modal input:focus, .modal select:focus, .modal textarea:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

/* Context Menu */
.ctx-menu {
  position: fixed; background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 4px; z-index: 9999; display: none;
  box-shadow: var(--shadow); min-width: 120px;
}
.ctx-menu .ctx-item {
  padding: 6px 14px; font-size: 0.85rem; cursor: pointer; border-radius: 4px;
  color: var(--text); transition: background 0.15s;
}
.ctx-menu .ctx-item:hover { background: var(--bg-card-hover); }
.ctx-menu .ctx-item.danger { color: var(--danger); }

/* ===== Timeline ===== */
.timeline { position: relative; padding-left: 28px; }
.timeline::before { content: ''; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--border); }
.timeline-item {
  position: relative; margin-bottom: 24px;
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 18px; cursor: pointer;
  transition: all 0.2s;
}
.timeline-item:hover { border-color: var(--border-hover); }
.timeline-item.expanded { border-color: var(--accent2); }
.timeline-dot { position: absolute; left: -22px; top: 22px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent2); border: 2px solid var(--bg); }
.timeline-year { font-size: 0.75rem; font-weight: 700; color: var(--accent2); }
.timeline-title { font-size: 1rem; font-weight: 600; color: var(--text-bright); margin: 2px 0; }
.timeline-role { font-size: 0.8rem; color: var(--text-dim); }
.timeline-detail { display: none; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 0.85rem; }
.timeline-item.expanded .timeline-detail { display: block; }
.timeline-detail h4 { color: var(--accent2); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; margin: 8px 0 2px; }
.timeline-detail h4:first-child { margin-top: 0; }

/* ===== Flash Cards ===== */
.flash-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; align-items: start; }
.flash-card { perspective: 800px; min-height: 220px; cursor: pointer; }
.flash-inner { position: relative; width: 100%; min-height: 220px; transition: transform 0.5s; transform-style: preserve-3d; }
.flash-card.flipped .flash-inner { transform: rotateY(180deg); }
.flash-front, .flash-back {
  position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
  border-radius: var(--radius); padding: 18px; display: flex;
  flex-direction: column; border: 1px solid var(--border);
}
.flash-front { background: var(--bg-card); text-align: center; justify-content: center; }
.flash-front .flash-q { font-size: 0.95rem; font-weight: 600; color: var(--text-bright); }
.flash-front .flash-hint { font-size: 0.7rem; color: var(--text-dim); margin-top: 6px; }
.flash-back { background: var(--bg-card); transform: rotateY(180deg); overflow-y: auto; font-size: 0.85rem; line-height: 1.6; justify-content: flex-start; }
.flash-back h4 { color: var(--accent); font-size: 0.75rem; margin: 6px 0 2px; }
.flash-back h4:first-child { margin-top: 0; }

/* ===== Dashboard Action Bar ===== */
.action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
.summary { font-size: 0.82rem; color: var(--text-dim); }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 50px 20px; color: var(--text-dim); }
.empty-state .icon { font-size: 2.5rem; margin-bottom: 10px; }
.empty-state p { font-size: 0.9rem; }

/* ===== Footer ===== */
.footer { text-align: center; padding: 20px; color: var(--text-dim); font-size: 0.78rem; border-top: 1px solid var(--border); margin-top: 40px; }

/* ===== Scrollbar ===== */
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ===== Responsive ===== */
@media (max-width: 768px) {
  .cards-grid, .flash-grid { grid-template-columns: 1fr; }
  .feature-grid { grid-template-columns: 1fr; }
  .tab-btn { font-size: 0.8rem; padding: 8px 10px; }
  .hero { padding: 30px 16px; }
  .hero h1 { font-size: 1.4rem; }
}
</style>
</head>
<body>

<!-- Header -->
<div class="header">
  <div class="header-inner">
    <div class="logo" onclick="showView('home')" title="返回主页">🏠 IC Notebook <span>· 知识库</span></div>
    <div class="header-actions">
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()" title="切换主题">🌙</button>
      <span id="headerUser" style="display:none"></span>
      <button class="btn" id="btnLogin" onclick="showView('auth')">登录</button>
      <button class="btn btn-sm" id="btnLogout" style="display:none" onclick="doLogout()">退出</button>
    </div>
  </div>
</div>

<!-- Homepage View -->
<div class="main view active" id="view-home">
  <div class="hero">
    <h1>IC Notebook <span>· 知识库</span></h1>
    <p>面向数字 IC 设计工程师的个人知识管理与面试备战工具。支持知识卡片编辑、项目复盘追踪、面试速查卡翻转。</p>
    <div>
      <button class="btn btn-primary" onclick="showView('auth')">注册 / 登录</button>
    </div>
  </div>

  <div class="feature-grid">
    <div class="feature-card"><div class="f-icon">📚</div><h3>知识库</h3><p>按技术领域分类管理 IC 设计知识点，支持增删改查</p></div>
    <div class="feature-card"><div class="f-icon">📋</div><h3>项目复盘</h3><p>时间线记录工作经历，沉淀经验</p></div>
    <div class="feature-card"><div class="f-icon">⚡</div><h3>面试速查</h3><p>翻转卡片复习高频考点，按分类筛选</p></div>
  </div>

  <div class="action-bar"><span class="summary" id="publicSummary"></span></div>
  <div class="filter-bar" id="publicFilter"></div>
  <div class="cards-grid" id="publicCards"></div>
</div>

<!-- Auth View -->
<div class="main view" id="view-auth">
  <div class="auth-wrap">
    <div class="auth-card" id="authLogin">
      <div class="a-icon">🔐</div>
      <h2>登录</h2>
      <div class="sub">访问你的个人知识库</div>
      <form onsubmit="doLogin();return false">
      <div class="error" id="loginError">用户名或密码错误</div>
      <div class="field"><label>用户名</label><input type="text" id="loginUser" placeholder="支持中文、字母、数字" autocomplete="off"></div>
      <div class="field"><label>密码</label><input type="password" id="loginPass" placeholder="输入密码" autocomplete="off"></div>
      <button class="btn btn-primary" type="submit">登录</button>
      </form>
      <div class="auth-switch">没有账号？<a onclick="switchAuth('register')">注册</a></div>
    </div>
    <div class="auth-card" id="authRegister" style="display:none">
      <div class="a-icon">📝</div>
      <h2>注册</h2>
      <div class="sub">创建你的个人知识库</div>
      <form onsubmit="doRegister();return false">
      <div class="error" id="regError">用户名已存在</div>
      <div class="field"><label>用户名</label><input type="text" id="regUser" placeholder="支持中文、字母、数字，3-20 位" autocomplete="off"></div>
      <div class="field"><label>密码</label><input type="password" id="regPass" placeholder="至少 6 位" autocomplete="new-password"></div>
      <div class="field"><label>确认密码</label><input type="password" id="regPass2" placeholder="再次输入密码" autocomplete="new-password"></div>
      <button class="btn btn-primary" type="submit">注册</button>
      </form>
      <div class="auth-switch">已有账号？<a onclick="switchAuth('login')">登录</a></div>
    </div>
  </div>
</div>

<!-- Dashboard View -->
<div class="main view" id="view-dash">
  <div class="tabs">
    <button class="tab-btn active" onclick="switchDashTab('knowledge')">📚 知识库</button>
    <button class="tab-btn" onclick="switchDashTab('projects')">📋 项目复盘</button>
    <button class="tab-btn" onclick="switchDashTab('flashcards')">⚡ 速查卡</button>
  </div>
  <div class="action-bar">
    <span class="summary" id="dashSummary"></span>
    <button class="btn btn-primary btn-sm" id="btnAdd" onclick="openAddModal()">+ 新增</button>
  </div>
  <div class="filter-bar" id="dashFilter"></div>
  <div class="search-wrap"><span class="s-icon">🔍</span><input type="text" id="dashSearch" placeholder="搜索..." oninput="renderDashboard()"></div>
  <div id="dashContent"></div>
</div>

<!-- Edit Modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<!-- Context Menu -->
<div class="ctx-menu" id="ctxMenu">
  <div class="ctx-item" onclick="ctxEditCat()">✏️ 编辑</div>
  <div class="ctx-item danger" onclick="ctxDeleteCat()">🗑 删除</div>
</div>

<div class="footer">IC Notebook · 个人知识管理 & 面试备战工具</div>

<script>
// ============================================================
// PUBLIC KNOWLEDGE (visible to all)
// ============================================================
const publicKnowledge = [
  { id:1, cat:'bus', tag:'总线', tagClass:'tag-bus', title:'AXI 总线协议要点', subtitle:'读写通道 / Outstanding / Out-of-Order', detail:'<h4>五个通道</h4><ul><li>写地址 (AW) / 写数据 (W) / 写响应 (B)</li><li>读地址 (AR) / 读数据 (R)</li></ul><h4>关键概念</h4><ul><li><strong>Outstanding</strong>：无需等待前一笔完成即可发新事务，由 ID 位宽决定最大数量</li><li><strong>Out-of-Order</strong>：响应顺序可不同于请求顺序，通过 ID 匹配</li><li><strong>Burst</strong>：FIXED / INCR / WRAP</li></ul><h4>常见问题</h4><ul><li>ID 位宽不够导致 Outstanding 受限</li><li>跨 4KB 边界时 burst 需拆分</li><li>WSTRB 非连续时的处理</li></ul>' },
  { id:2, cat:'other', tag:'通用', tagClass:'tag-other', title:'CDC 跨时钟域处理', subtitle:'同步器 / FIFO / 握手协议', detail:'<h4>常见方案</h4><ul><li><strong>两级同步器</strong>（2-FF Synchronizer）：单 bit 信号同步，最常用</li><li><strong>异步 FIFO</strong>：多 bit 数据跨时钟域，使用格雷码指针</li><li><strong>握手协议</strong>：请求-应答机制，适合低频控制信号</li></ul><h4>中断相关 CDC</h4><ul><li>电平中断：两级同步器即可</li><li>脉冲中断：需要脉冲展宽器，确保脉冲宽度 > 目标时钟周期 × 2</li></ul><h4>常见陷阱</h4><ul><li>多 bit 信号直接用两级同步器 → 数据不一致（需用异步 FIFO 或握手）</li><li>异步 FIFO 的满/空判断时机</li><li>复位信号也需要 CDC 处理</li></ul>' },
  { id:3, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'reg 与 wire 的区别', subtitle:'数据类型选择与使用场景', detail:'<h4>核心区别</h4><ul><li><strong>wire</strong>：表示连线，无存储能力，必须由 assign 或模块端口持续驱动。用于组合逻辑输出、模块互联</li><li><strong>reg</strong>：表示寄存器/变量，有存储能力，在 always/initial 块中赋值。用于时序逻辑、组合逻辑的过程赋值</li></ul><h4>使用场景</h4><ul><li>wire：连续赋值（assign）、模块实例化端口连接、组合逻辑网表</li><li>reg：always 块内赋值、时序逻辑输出、过程块中的中间变量</li></ul><h4>常见误区</h4><ul><li>reg 不一定综合成寄存器——在组合 always @(*) 中的 reg 综合成 wire</li><li>wire 不一定只是连线——可以有多驱动源（需用 tri/wor 等）</li></ul>' },
  { id:4, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'阻塞赋值 = 与非阻塞赋值 <=', subtitle:'使用场景与综合差异', detail:'<h4>阻塞赋值 =</h4><ul><li>顺序执行，立即生效</li><li>用于组合逻辑 always @(*) 块</li><li>多条 = 语句按书写顺序执行，前一条结果影响后一条</li></ul><h4>非阻塞赋值 <=</h4><ul><li>并行执行，同时更新</li><li>用于时序逻辑 always @(posedge clk) 块</li><li>所有 <= 右侧在时钟沿同时采样，左侧在时钟沿后同时更新</li></ul><h4>为什么时序逻辑必须用非阻塞？</h4><ul><li>硬件本质：所有触发器在时钟沿同时采样 D 端，同时更新 Q 端</li><li>用阻塞赋值会导致仿真顺序依赖，与硬件行为不一致</li><li>例：移位寄存器 a<=b; b<=c; 在时钟沿后 a 得到 b 的旧值，b 得到 c 的旧值——这才是硬件行为</li><li>若用阻塞：a=b; b=c; 则 a 得到 b 已更新后的值，变成链式传递，与实际硬件不符</li></ul><h4>混合使用风险</h4><ul><li>同一个 always 块中混用 = 和 <= 是语法允许但强烈不推荐</li><li>综合工具会给出警告，仿真结果可能出乎意料</li></ul>' },
  { id:5, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'仿真竞争问题', subtitle:'Race Condition 与确定性仿真', detail:'<h4>什么是仿真竞争</h4><p>多个 always 块在同一仿真时刻被触发，执行顺序不确定，导致结果依赖于调度顺序。</p><h4>常见场景</h4><ul><li>同一时钟沿，两个 always 块读写同一变量</li><li>组合逻辑环路：a=b; b=a; 在同一时刻互相依赖</li><li>阻塞赋值与非阻塞赋值混用导致更新时机混乱</li></ul><h4>避免方法</h4><ul><li>时序逻辑统一用非阻塞 <=</li><li>组合逻辑统一用阻塞 =</li><li>避免多个 always 块驱动同一变量</li><li>使用 #0 延迟不是好习惯——会掩盖问题而非解决</li><li>SystemVerilog 引入 always_ff / always_comb 明确意图</li></ul><h4>仿真调度机制</h4><ul><li>Active 区域：阻塞赋值、非阻塞赋值右侧采样</li><li>NBA 区域：非阻塞赋值左侧更新</li><li>Postponed 区域：$monitor 等</li></ul>' },
  { id:6, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'initial 与 always 的区别', subtitle:'仿真与综合视角', detail:'<h4>initial 块</h4><ul><li>在仿真开始时执行一次</li><li>不可综合（或仅在 FPGA 中用于初始化）</li><li>用途：测试激励生成、寄存器初始化（仿真）、$display 输出</li><li>多个 initial 块并行执行，之间顺序不确定</li></ul><h4>always 块</h4><ul><li>循环执行，敏感列表触发</li><li>可综合（取决于写法）</li><li>类型：always @(*)、always @(posedge clk)、always @(negedge rst)</li></ul><h4>always 综合规则</h4><ul><li>always @(posedge clk)：综合成触发器</li><li>always @(*) 或 always_comb：综合成组合逻辑</li><li>always @(posedge clk or negedge rst)：带异步复位的触发器</li><li>不完整的敏感列表会导致仿真与综合不一致</li></ul>' },
  { id:7, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'task 与 function 的区别', subtitle:'可综合性与使用场景', detail:'<h4>function</h4><ul><li>必须有返回值</li><li>不能包含时序控制（#、@、wait）</li><li>调用时间：零仿真时间</li><li>可综合（纯组合逻辑）</li><li>内部只能调用其他 function</li><li>不能有 output/inout 端口</li></ul><h4>task</h4><ul><li>可以无返回值</li><li>可以包含时序控制</li><li>调用时间：可以消耗仿真时间</li><li>可综合（需满足约束）</li><li>可以调用其他 task 和 function</li><li>可以有 output/inout 端口</li></ul><h4>选择建议</h4><ul><li>纯组合计算 → function</li><li>需要时序控制或多周期行为 → task（仿真）</li><li>RTL 中常用 function 做译码、计算等</li><li>task 在 RTL 中较少使用，主要用于 testbench</li></ul>' },
  { id:8, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'static vs automatic task', subtitle:'存储分配与递归调用', detail:'<h4>static（默认）</h4><ul><li>所有调用共享同一块存储空间</li><li>递归调用会互相覆盖变量</li><li>适合简单、不重入的场景</li><li>Verilog 默认 static</li></ul><h4>automatic</h4><ul><li>每次调用分配独立存储空间</li><li>支持递归调用，互不干扰</li><li>SystemVerilog 中模块级 task 默认 static，类中默认 automatic</li><li>关键字：task automatic my_task(...)</li></ul><h4>实际影响</h4><ul><li>递归 function 必须声明为 automatic</li><li>多个 always 块同时调用同一 static task 可能产生竞争</li><li>测试平台中的 task 通常声明为 automatic 避免意外</li></ul><h4>示例</h4><p><code>function automatic [31:0] factorial(input [5:0] n);</code><br>递归计算阶乘，必须用 automatic 否则递归变量互相覆盖。</p>' },
  { id:9, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'generate 块使用场景', subtitle:'与 for 循环的区别', detail:'<h4>generate 用途</h4><ul><li>批量实例化模块（如 8 个相同的 FIFO）</li><li>条件编译/实例化（if-else 选择不同模块）</li><li>参数化硬件结构</li></ul><h4>generate-for vs 普通 for</h4><ul><li><strong>generate-for</strong>：在 elaborate 阶段展开，每个迭代是独立的硬件实例。用于实例化模块、assign 语句、always 块</li><li><strong>普通 for（always 内）</strong>：在仿真时循环执行，综合成组合逻辑链或状态机</li></ul><h4>典型用法</h4><ul><li>genvar i; generate for(i=0;i<N;i=i+1) begin : gen_block ... end endgenerate</li><li>必须用 genvar 声明循环变量</li><li>每个迭代生成一个独立的命名块（gen_block[0], gen_block[1]...）</li></ul><h4>常见错误</h4><ul><li>在 generate-for 中使用 integer 而非 genvar</li><li>generate-for 中忘记命名块，导致内部信号无法层级访问</li><li>generate-if 条件必须是常量表达式（elaborate 时确定）</li></ul>' },
  { id:10, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'Verilog 语句块', subtitle:'begin-end / fork-join / 命名块', detail:'<h4>begin-end（顺序块）</h4><ul><li>语句按顺序执行</li><li>常用于 always 块、initial 块、task/function 体</li><li>综合时通常对应组合逻辑链或状态机</li></ul><h4>fork-join（并行块）</h4><ul><li>内部语句并行执行</li><li>不可综合，仅用于仿真</li><li>三个变体：fork-join（等所有完成）、fork-join_any（等任一完成）、fork-join_none（不等，立即继续）</li></ul><h4>命名块</h4><ul><li>begin : block_name ... end</li><li>可以声明局部变量（作用域限定在块内）</li><li>可以用 disable block_name 提前退出</li><li>综合时命名块主要用于 generate 和层级命名</li></ul>' },
  { id:11, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'RTL 代码常见坑', subtitle:'综合陷阱与仿真不一致', detail:'<h4>常见坑</h4><ul><li><strong>不完整敏感列表</strong>：always @(a) 缺少 b，仿真只在 a 变化时触发，综合成 latch 或与仿真不一致</li><li><strong>Latch 意外生成</strong>：if 缺少 else、case 缺少 default，组合逻辑中未覆盖所有分支 → 综合成 latch</li><li><strong>阻塞/非阻塞混用</strong>：同一块中混用 = 和 <=，仿真行为难预测</li><li><strong>多驱动</strong>：多个 always 块驱动同一变量 → 综合报错</li><li><strong>复位遗漏</strong>：时序逻辑中部分寄存器在 if(rst) 分支外有赋值，导致复位行为不一致</li><li><strong>宽度不匹配</strong>：隐式位宽扩展，如 {a, b} + c 与 a + b + c 结果不同</li><li><strong>for 循环展开过大</strong>：大循环在综合时展开成巨大组合逻辑，时序难收敛</li></ul><h4>检查方法</h4><ul><li>综合后检查 latch 报告</li><li>跑 lint 工具（SpyGlass、Verilator）</li><li>对比仿真与形式验证结果</li></ul>' },
  { id:12, cat:'verilog', tag:'Verilog', tagClass:'tag-verilog', title:'双向 inout 端口正确实现', subtitle:'三态门与总线协议', detail:'<h4>inout 端口本质</h4><p>双向端口在物理上对应的是一根既可用于输入也可用于输出的线，需要三态门控制。</p><h4>正确实现</h4><ul><li>用三态 buffer：<code>assign io_pin = oe ? out_val : 1\'bz;</code></li><li>oe（输出使能）= 1 时驱动输出，= 0 时高阻（外部驱动）</li><li>读取时：<code>assign in_val = io_pin;</code> 持续读取</li></ul><h4>关键注意事项</h4><ul><li>inout 只能出现在模块端口，不能作为 always 块的 reg 变量</li><li>顶层测试平台中 inout 需用 wire 类型</li><li>多个三态驱动可以共享同一根线（总线），但同一时刻只能有一个 oe=1</li><li>高阻态 z 在综合时自动映射为三态 buffer（仅顶层端口）</li><li>内部逻辑不能用 inout，需分解为 data_in、data_out、data_oe 三个信号</li></ul><h4>内部处理模式</h4><ul><li>顶层模块：inout 端口 + 三态逻辑</li><li>内部模块：分离的 input/output/enable 信号</li><li>例：I2C SDA 线——顶层三态驱动，内部用 sda_in/sda_out/sda_oe</li></ul>' }
];

let currentView = 'home';
let dashTab = 'knowledge';
let dashCat = 'all';
let currentUser = null; // { username }
let userData = {}; // { knowledge: [], projects: [], flashcards: [], knowledgeCats: [], flashcardCats: [] }
let editingId = null;

// Get categories for current tab
function getCats() {
  if (dashTab === 'knowledge') return userData.knowledgeCats || ['默认分组'];
  if (dashTab === 'flashcards') return userData.flashcardCats || ['默认分组'];
  return [];
}
function setCats(arr) {
  if (dashTab === 'knowledge') userData.knowledgeCats = arr;
  else if (dashTab === 'flashcards') userData.flashcardCats = arr;
}
function addCat(name) {
  const cats = getCats();
  if (!cats.includes(name)) { cats.push(name); setCats(cats); }
}
function removeCat(name) {
  if (dashTab === 'knowledge') userData.knowledgeCats = userData.knowledgeCats.filter(c => c !== name);
  else if (dashTab === 'flashcards') userData.flashcardCats = userData.flashcardCats.filter(c => c !== name);
}
function renameCat(oldName, newName) {
  if (dashTab === 'knowledge') {
    const idx = userData.knowledgeCats.indexOf(oldName);
    if (idx >= 0) userData.knowledgeCats[idx] = newName;
  } else if (dashTab === 'flashcards') {
    const idx = userData.flashcardCats.indexOf(oldName);
    if (idx >= 0) userData.flashcardCats[idx] = newName;
  }
}

function getUsers() { try { return JSON.parse(localStorage.getItem('ic_users') || '{}'); } catch(e) { return {}; } }
function saveUsers(u) { localStorage.setItem('ic_users', JSON.stringify(u)); }

async function hash(str) {
  // Try native SHA-256 (secure context only)
  try {
    if (crypto.subtle) {
      const encoder = new TextEncoder();
      const hashBuffer = await crypto.subtle.digest('SHA-256', encoder.encode(str));
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  } catch(e) { /* fallback */ }
  // Fallback for non-secure context (local file://)
  let h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57;
  for (let i = 0; i < str.length; i++) {
    const ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return ((h2 >>> 0).toString(16).padStart(8,'0') + (h1 >>> 0).toString(16).padStart(8,'0'));
}

// Old hash for backward compatibility
function oldHash(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = ((h << 5) - h) + str.charCodeAt(i); h |= 0; }
  return h.toString(16);
}

async function doRegister() {
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  const err = document.getElementById('regError');
  err.classList.remove('show');
  if (!/^[a-zA-Z0-9_\u4e00-\u9fa5]{3,20}$/.test(u)) { err.textContent = '用户名 3-20 位字母数字或中文'; err.classList.add('show'); return; }
  if (p.length < 6) { err.textContent = '密码至少 6 位'; err.classList.add('show'); return; }
  if (p !== p2) { err.textContent = '两次密码不一致'; err.classList.add('show'); return; }
  const users = getUsers();
  if (users[u]) { err.textContent = '用户名已存在'; err.classList.add('show'); return; }
  users[u] = await hash(p);
  saveUsers(users);
  alert('注册成功！请登录');
  switchAuth('login');
  document.getElementById('loginUser').value = u;
}

async function doLogin() {
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  err.classList.remove('show');
  const users = getUsers();
  if (!users[u]) { err.classList.add('show'); return; }
  const newHash = await hash(p);
  if (users[u] === newHash) {
    // New hash matches
  } else if (users[u] === oldHash(p)) {
    // Old hash matches, upgrade to new
    users[u] = newHash;
    saveUsers(users);
  } else {
    err.classList.add('show'); return;
  }
  currentUser = { username: u };
  loadUserData();
  clearAuthForms();
  updateHeader();
  showView('dash');
  switchDashTab('knowledge');
}

function doLogout() {
  currentUser = null;
  userData = {};
  clearAuthForms();
  updateHeader();
  showView('home');
}

function clearAuthForms() {
  document.getElementById('loginUser').value = '';
  document.getElementById('loginPass').value = '';
  document.getElementById('regUser').value = '';
  document.getElementById('regPass').value = '';
  document.getElementById('regPass2').value = '';
}

function loadUserData() {
  const key = 'ic_data_' + currentUser.username;
  try {
    const d = JSON.parse(localStorage.getItem(key) || '{}');
    userData.knowledge = d.knowledge || defaultKnowledge();
    userData.projects = d.projects || defaultProjects();
    userData.flashcards = d.flashcards || defaultFlashcards();
    userData.knowledgeCats = d.knowledgeCats || ['默认分组'];
    userData.flashcardCats = d.flashcardCats || ['默认分组'];
  } catch(e) {
    userData = { knowledge: defaultKnowledge(), projects: defaultProjects(), flashcards: defaultFlashcards(), knowledgeCats: ['默认分组'], flashcardCats: ['默认分组'] };
  }
}

function saveUserData() {
  if (!currentUser) return;
  localStorage.setItem('ic_data_' + currentUser.username, JSON.stringify(userData));
}

// ============================================================
// VIEW NAVIGATION
// ============================================================
function showView(name) {
  currentView = name;
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  const v = document.getElementById('view-' + name);
  if (v) v.classList.add('active');
  updateHeader();
  if (name === 'home') renderPublic();
  if (name === 'auth') { document.getElementById('loginUser').focus(); }
  if (name === 'dash') renderDashboard();
}

function updateHeader() {
  const btnLogin = document.getElementById('btnLogin');
  const btnLogout = document.getElementById('btnLogout');
  const headerUser = document.getElementById('headerUser');
  if (currentUser) {
    btnLogin.style.display = 'none';
    btnLogout.style.display = '';
    headerUser.style.display = '';
    headerUser.innerHTML = '<span class="user-badge">👤 ' + currentUser.username + '</span>';
  } else {
    btnLogin.style.display = '';
    btnLogout.style.display = 'none';
    headerUser.style.display = 'none';
  }
}

function switchAuth(mode) {
  clearAuthForms();
  document.getElementById('authLogin').style.display = mode === 'login' ? '' : 'none';
  document.getElementById('authRegister').style.display = mode === 'register' ? '' : 'none';
  document.getElementById('loginError').classList.remove('show');
  document.getElementById('regError').classList.remove('show');
  if (mode === 'login') document.getElementById('loginUser').focus();
  else document.getElementById('regUser').focus();
}

// ============================================================
// THEME
// ============================================================
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme') || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  document.getElementById('themeBtn').textContent = next === 'light' ? '☀️' : '🌙';
  localStorage.setItem('theme', next);
}

// ============================================================
// PUBLIC KNOWLEDGE RENDER
// ============================================================
let publicCat = 'all';
function renderPublic() {
  const cats = [
    { key:'all', label:'全部' }, { key:'verilog', label:'Verilog' },
    { key:'bus', label:'总线' }, { key:'other', label:'通用' }
  ];
  let items = publicCat === 'all' ? publicKnowledge : publicKnowledge.filter(i => i.cat === publicCat);
  document.getElementById('publicSummary').textContent = '📖 公开知识 · 共 ' + items.length + ' 条';
  let fhtml = '';
  cats.forEach(c => { fhtml += '<button class="filter-chip' + (publicCat === c.key ? ' active' : '') + '" onclick="publicCat=\'' + c.key + '\';renderPublic()">' + c.label + '</button>'; });
  document.getElementById('publicFilter').innerHTML = fhtml;
  document.getElementById('publicCards').innerHTML = items.map(c => renderKnowledgeCard(c, false)).join('');
}

function renderKnowledgeCard(item, isPrivate) {
  const color = getCatColor(item.cat);
  const tagStyle = 'style="background:' + color + '22;color:' + color + '"';
  const actions = isPrivate ? '<div class="card-actions"><button class="btn btn-sm" onclick="event.stopPropagation();openEditModal(\'' + dashTab + '\',' + item.id + ')">✏️ 编辑</button><button class="btn btn-sm" onclick="event.stopPropagation();deleteItem(\'' + dashTab + '\',' + item.id + ')" style="color:var(--danger)">🗑 删除</button></div>' : '';
  return '<div class="knowledge-card" onclick="this.classList.toggle(\'expanded\')"><span class="card-tag" ' + tagStyle + '>' + escHtml(item.cat) + '</span><div class="card-title">' + escHtml(item.title) + '</div><div class="card-subtitle">' + escHtml(item.subtitle) + '</div><div class="card-detail">' + item.detail + actions + '</div></div>';
}

// ============================================================
// DASHBOARD RENDER
// ============================================================
function switchDashTab(tab) {
  dashTab = tab;
  dashCat = 'all';
  document.querySelectorAll('#view-dash .tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('#view-dash .tab-btn').forEach(b => { if (b.textContent.includes(tab === 'knowledge' ? '知识库' : tab === 'projects' ? '项目复盘' : '速查卡')) b.classList.add('active'); });
  document.getElementById('btnAdd').textContent = tab === 'projects' ? '+ 新增项目' : tab === 'flashcards' ? '+ 新增速查卡' : '+ 新增知识点';
  renderDashboard();
}

function renderDashboard() {
  const query = (document.getElementById('dashSearch')?.value || '').toLowerCase().trim();
  const cats = getCats();

  let items = dashCat === 'all' ? [...userData[dashTab]] : userData[dashTab].filter(i => i.cat === dashCat);
  if (query) {
    items = items.filter(i => (i.title || i.q || '').toLowerCase().includes(query) || (i.subtitle || i.role || '').toLowerCase().includes(query) || (i.detail || i.a || '').toLowerCase().includes(query));
  }

  document.getElementById('dashSummary').textContent = (dashTab === 'knowledge' ? '📚' : dashTab === 'projects' ? '📋' : '⚡') + ' 共 ' + items.length + ' 条 · 可编辑';
  let fhtml = '<button class="filter-chip' + (dashCat === 'all' ? ' active' : '') + '" onclick="dashCat=\'all\';renderDashboard()">全部</button>';
  cats.forEach(c => {
    fhtml += '<button class="filter-chip' + (dashCat === c ? ' active' : '') + '" onclick="dashCat=\'' + c.replace(/'/g, "\\'") + '\';renderDashboard()" style="border-color:' + getCatColor(c) + '">' + escHtml(c) + '</button>';
  });
  if (dashTab !== 'projects') {
    fhtml += '<button class="filter-chip" onclick="addCategory()" title="添加自定义分类" style="border-style:dashed">+ 自定义分类</button>';
  }
  document.getElementById('dashFilter').innerHTML = fhtml;

  let html = '';
  if (dashTab === 'knowledge') {
    html += '<div class="cards-grid">';
    items.forEach(c => { html += renderKnowledgeCard(c, true); });
    html += '<div class="add-card" onclick="openAddModal()">+ 新增知识点</div></div>';
  } else if (dashTab === 'projects') {
    html += '<div class="timeline">';
    items.forEach(p => {
      html += '<div class="timeline-item" onclick="this.classList.toggle(\'expanded\')"><div class="timeline-dot"></div><div class="timeline-year">' + escHtml(p.year) + '</div><div class="timeline-title">' + escHtml(p.title) + '</div><div class="timeline-role">' + escHtml(p.role) + '</div><div class="timeline-detail">' + p.detail + '<div class="card-actions"><button class="btn btn-sm" onclick="event.stopPropagation();openEditModal(\'projects\',' + p.id + ')">✏️ 编辑</button><button class="btn btn-sm" onclick="event.stopPropagation();deleteItem(\'projects\',' + p.id + ')" style="color:var(--danger)">🗑 删除</button></div></div></div>';
    });
    html += '<div class="add-card" onclick="openAddModal()">+ 新增项目</div></div>';
  } else {
    html += '<div class="flash-grid">';
    items.forEach(f => {
      const color = getCatColor(f.cat);
      html += '<div class="flash-card" onclick="this.classList.toggle(\'flipped\')"><div class="flash-inner"><div class="flash-front"><span class="flash-tag card-tag" style="background:' + color + '22;color:' + color + '">' + escHtml(f.cat) + '</span><div class="flash-q">' + escHtml(f.q) + '</div><div class="flash-hint">👆 点击翻转</div></div><div class="flash-back">' + f.a + '<div class="card-actions" style="margin-top:8px"><button class="btn btn-sm" onclick="event.stopPropagation();openEditModal(\'flashcards\',' + f.id + ')">✏️ 编辑</button><button class="btn btn-sm" onclick="event.stopPropagation();deleteItem(\'flashcards\',' + f.id + ')" style="color:var(--danger)">🗑 删除</button></div></div></div></div>';
    });
    html += '<div class="add-card" onclick="openAddModal()">+ 新增速查卡</div></div>';
  }
  document.getElementById('dashContent').innerHTML = html || '<div class="empty-state"><div class="icon">📭</div><p>没有匹配的内容</p></div>';
}

// ============================================================
// MODAL: ADD / EDIT
// ============================================================
function openAddModal() {
  editingId = null;
  showModal(dashTab);
}

function openEditModal(tab, id) {
  dashTab = tab;
  editingId = id;
  showModal(tab);
}

function showModal(tab) {
  const overlay = document.getElementById('modalOverlay');
  const content = document.getElementById('modalContent');
  overlay.classList.remove('hidden');

  let item = editingId ? userData[tab].find(i => i.id === editingId) : null;
  const cats = getCats();

  let form = '<h3>' + (editingId ? '编辑' : '新增') + (tab === 'knowledge' ? '知识点' : tab === 'projects' ? '项目' : '速查卡') + '</h3>';

  if (tab === 'knowledge') {
    form += '<div class="field"><label>分类</label><select id="mfCat" onchange="onCatChange()">' + cats.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '"' + (item && item.cat === c ? ' selected' : '') + '>' + c + '</option>').join('') + '<option value="__custom__">⚡ 自定义分类...</option></select></div>';
    form += '<div class="field" id="mfCatCustom" style="display:none"><label>新分类名称</label><input type="text" id="mfCatName" placeholder="输入分类名称"></div>';
    form += '<div class="field"><label>标题</label><input type="text" id="mfTitle" value="' + (item ? escHtml(item.title) : '') + '"></div>';
    form += '<div class="field"><label>副标题</label><input type="text" id="mfSub" value="' + (item ? escHtml(item.subtitle) : '') + '"></div>';
    form += '<div class="field"><label>详细内容 (HTML)</label><textarea id="mfDetail">' + (item ? item.detail : '') + '</textarea></div>';
  } else if (tab === 'projects') {
    form += '<div class="field"><label>年份</label><input type="text" id="mfYear" value="' + (item ? escHtml(item.year) : '') + '"></div>';
    form += '<div class="field"><label>项目名称</label><input type="text" id="mfTitle" value="' + (item ? escHtml(item.title) : '') + '"></div>';
    form += '<div class="field"><label>角色</label><input type="text" id="mfRole" value="' + (item ? escHtml(item.role) : '') + '"></div>';
    form += '<div class="field"><label>详细内容 (HTML)</label><textarea id="mfDetail">' + (item ? item.detail : '') + '</textarea></div>';
  } else {
    form += '<div class="field"><label>分类</label><select id="mfCat" onchange="onCatChange()">' + cats.map(c => '<option value="' + c.replace(/"/g,'&quot;') + '"' + (item && item.cat === c ? ' selected' : '') + '>' + c + '</option>').join('') + '<option value="__custom__">⚡ 自定义分类...</option></select></div>';
    form += '<div class="field" id="mfCatCustom" style="display:none"><label>新分类名称</label><input type="text" id="mfCatName" placeholder="输入分类名称"></div>';
    form += '<div class="field"><label>问题</label><input type="text" id="mfQ" value="' + (item ? escHtml(item.q) : '') + '"></div>';
    form += '<div class="field"><label>答案 (HTML)</label><textarea id="mfA">' + (item ? item.a : '') + '</textarea></div>';
  }
  form += '<div class="modal-actions"><button class="btn" onclick="closeModal()">取消</button><button class="btn btn-primary" onclick="saveItem()">保存</button></div>';
  content.innerHTML = form;
}

function onCatChange() {
  const sel = document.getElementById('mfCat');
  const custom = document.getElementById('mfCatCustom');
  if (sel && custom) custom.style.display = sel.value === '__custom__' ? '' : 'none';
}

// Add right-click context menu on category selects AND filter chips
document.addEventListener('contextmenu', function(e) {
  // Check if right-clicking on category select in modal
  const sel = e.target.closest('select');
  if (sel && sel.id === 'mfCat') {
    e.preventDefault();
    const val = sel.value;
    if (val === '__custom__' || val === '默认分组') { hideCtxMenu(); return; }
    window._ctxCat = val;
    showCtxMenu(e.pageX, e.pageY);
    return;
  }
  // Check if right-clicking on filter bar chip
  const chip = e.target.closest('.filter-chip');
  if (chip && chip.textContent && !chip.textContent.includes('全部') && !chip.textContent.includes('自定义')) {
    const name = chip.textContent.replace(/✕/g,'').trim();
    if (name === '默认分组') { hideCtxMenu(); return; }
    e.preventDefault();
    window._ctxCat = name;
    showCtxMenu(e.pageX, e.pageY);
    return;
  }
  hideCtxMenu();
});
document.addEventListener('click', hideCtxMenu);

function showCtxMenu(x, y) {
  const menu = document.getElementById('ctxMenu');
  menu.style.display = 'block';
  menu.style.left = x + 'px';
  menu.style.top = y + 'px';
}
function hideCtxMenu() { document.getElementById('ctxMenu').style.display = 'none'; }

function ctxEditCat() {
  hideCtxMenu();
  const oldName = window._ctxCat;
  const newName = prompt('编辑分类名称：', oldName);
  if (!newName || !newName.trim() || newName.trim() === oldName) return;
  const trimmed = newName.trim();
  const cats = getCats();
  if (cats.includes(trimmed)) { alert('分类已存在'); return; }
  renameCat(oldName, trimmed);
  userData[dashTab].forEach(i => { if (i.cat === oldName) i.cat = trimmed; });
  saveUserData();
  if (dashCat === oldName) dashCat = trimmed;
  renderDashboard();
  if (editingId) { openEditModal(dashTab, editingId); }
}

function ctxDeleteCat() {
  hideCtxMenu();
  deleteCategory(window._ctxCat);
  if (editingId) { openEditModal(dashTab, editingId); }
}

function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function saveItem() {
  const tab = dashTab;

  let cat;
  if (tab !== 'projects') {
    const sel = document.getElementById('mfCat');
    if (sel.value === '__custom__') {
      cat = document.getElementById('mfCatName').value.trim();
      if (!cat) { alert('请输入分类名称'); return; }
      if (!userData.categories || !userData.categories.includes(cat)) {
        addCat(cat);
      }
    } else {
      cat = sel.value;
    }
  }

  let item;
  if (tab === 'knowledge') {
    item = { id: editingId || Date.now(), cat, title: document.getElementById('mfTitle').value.trim(), subtitle: document.getElementById('mfSub').value.trim(), detail: document.getElementById('mfDetail').value };
    if (!item.title) { alert('请输入标题'); return; }
  } else if (tab === 'projects') {
    item = { id: editingId || Date.now(), year: document.getElementById('mfYear').value.trim(), title: document.getElementById('mfTitle').value.trim(), role: document.getElementById('mfRole').value.trim(), detail: document.getElementById('mfDetail').value };
    if (!item.title) { alert('请输入项目名称'); return; }
  } else {
    item = { id: editingId || Date.now(), cat, q: document.getElementById('mfQ').value.trim(), a: document.getElementById('mfA').value };
    if (!item.q) { alert('请输入问题'); return; }
  }

  if (editingId) {
    const idx = userData[tab].findIndex(i => i.id === editingId);
    if (idx >= 0) userData[tab][idx] = item;
  } else {
    userData[tab].push(item);
  }
  saveUserData();
  closeModal();
  renderDashboard();
}

function deleteItem(tab, id) {
  if (!confirm('确定删除？')) return;
  userData[tab] = userData[tab].filter(i => i.id !== id);
  saveUserData();
  renderDashboard();
}

// ============================================================
// CATEGORY MANAGEMENT
// ============================================================
function addCategory() {
  const name = prompt('输入新分类名称：');
  if (!name || !name.trim()) return;
  const trimmed = name.trim();
  const cats = getCats();
  if (cats.includes(trimmed)) { alert('分类已存在'); return; }
  addCat(trimmed);
  saveUserData();
  dashCat = trimmed;
  renderDashboard();
}

function deleteCategory(name) {
  if (name === '默认分组') { alert('默认分组不可删除'); return; }
  const count = userData[dashTab].filter(i => i.cat === name).length;
  let msg = '确定删除分类「' + name + '」？';
  if (count > 0) msg += '\n\n该分类下有 ' + count + ' 条内容，删除后内容将移至「默认分组」。';
  if (!confirm(msg)) return;
  userData[dashTab].forEach(i => { if (i.cat === name) i.cat = '默认分组'; });
  removeCat(name);
  if (dashCat === name) dashCat = 'all';
  saveUserData();
  renderDashboard();
}

// ============================================================
// HELPERS
// ============================================================
const CAT_COLORS = ['#4ade80','#60a5fa','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316','#6366f1'];
function getCatColor(name) {
  let h = 0; for (let i=0;i<name.length;i++) h = ((h<<5)-h)+name.charCodeAt(i);
  return CAT_COLORS[Math.abs(h) % CAT_COLORS.length];
}
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ============================================================
// INIT
// ============================================================
(function() {
  const savedTheme = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', savedTheme);
  document.getElementById('themeBtn').textContent = savedTheme === 'light' ? '☀️' : '🌙';

  // Check session
  const sess = sessionStorage.getItem('ic_session');
  if (sess) {
    try {
      const u = JSON.parse(sess);
      const users = getUsers();
      if (u && users[u.username]) {
        currentUser = u;
        loadUserData();
        updateHeader();
        showView('dash');
        switchDashTab('knowledge');
        return;
      }
    } catch(e) {}
  }

  renderPublic();
})();

// Save session on login
const origLogin = doLogin;
doLogin = async function() {
  await origLogin();
  if (currentUser) sessionStorage.setItem('ic_session', JSON.stringify({ username: currentUser.username }));
};

// Clear session on logout
const origLogout = doLogout;
doLogout = function() {
  sessionStorage.removeItem('ic_session');
  origLogout();
};
